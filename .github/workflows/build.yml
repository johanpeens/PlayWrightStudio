name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # Warnings here are usually MudBlazor analyzer complaints about a real mistake,
      # so they are worth failing on.
      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror
