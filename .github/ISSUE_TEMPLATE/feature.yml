name: Idea
description: Something the studio should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, not the feature. What are you trying to get through?
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you work around it today
      description: Or say that you cannot.

  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
      description: Optional - the problem is the important half.
